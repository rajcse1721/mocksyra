          <div class="eyebrow hero-eyebrow"><span></span>A LITTLE PRACTICE. A LOT MORE CONFIDENCE.</div>
          <h1 id="hero-title">Your next interview.<br><em>Your best self.</em></h1>
          <p class="hero-description">Meet a real person. Talk through real problems. Build the confidence to walk into your next interview feeling ready.</p>
          <div class="hero-actions"><button class="button" data-route="onboarding">Find your practice partner <span aria-hidden="true">↗</span></button><button class="text-button" data-scroll="how">How it works <span aria-hidden="true">↓</span></button></div>
          <p class="hero-footnote"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>Free practice. Human connection. Your pace.</p>
        </div>
        <div class="practice-preview" aria-label="Example practice room showing a candidate and interviewer alongside a shared coding workspace">
          <div class="preview-header"><span><i></i>Practice room</span><span class="preview-example">EXAMPLE</span><span class="preview-timer">24:08</span></div>

            <div class="preview-person preview-candidate"><div class="abstract-person abstract-one"><div class="abstract-head"></div><div class="abstract-body"></div></div><div class="preview-name"><span>You</span><span>Candidate</span></div><span class="sound-wave" aria-hidden="true"><i></i><i></i><i></i></span></div>

          <div class="preview-controls" aria-hidden="true"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg></span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="m15 10 6-3v10l-6-3"/></svg></span><span class="preview-end"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 13c5-5 13-5 18 0v4h-5v-4a11 11 0 0 0-8 0v4H3z"/></svg></span><span class="preview-control-caption">Space to think out loud.</span></div>

      <div class="practice-benefits shell"><span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m8 4-6 8 6 8m8-16 6 8-6 8m-2-17-4 18"/></svg>Match by your technology</span><span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 2v6m10-6v6M3 11h18m-14 4h3m4 0h3"/></svg>Make time today or tomorrow</span><span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 11a8 8 0 0 1-8 8H4l-2 3V11a9 9 0 0 1 18 0Z"/><path d="M6 8h9M6 12h6"/></svg>Leave with useful feedback</span></div>
      <section class="modes-section shell" id="modes" aria-labelledby="modes-title">
        <div class="section-heading"><div><div class="eyebrow">THREE WAYS TO GROW</div><h2 id="modes-title">Your practice.<br>Your kind of session.</h2></div><p>Preparing for your next role or helping someone find theirs? There is a seat for you.</p></div>
        <div class="landing-mode-grid">
          <article class="landing-mode-card"><div class="landing-mode-top"><span class="landing-mode-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2M19 3l1 1 2-2"/></svg></span><span class="duration-pill">45 minutes</span></div><span class="mode-kicker">TAKE THE HOT SEAT</span><h3>Candidate</h3><p>Practise answering questions with someone focused on your growth. Get feedback on your approach, clarity, and technical skills.</p><div class="mode-detail">You answer. Your partner guides.</div><button class="button secondary full" data-route="onboarding" data-mode="candidate">Practise as a candidate <span aria-hidden="true">↗</span></button></article>
          <article class="landing-mode-card"><div class="landing-mode-top"><span class="landing-mode-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 9h6m-6 4h6m-6 4h4"/></svg></span><span class="duration-pill">45 minutes</span></div><span class="mode-kicker">HELP SOMEONE SHINE</span><h3>Interviewer</h3><p>Guide a candidate through a mock interview. Sharpen your questioning, practise evaluating answers, and share what you know.</p><div class="mode-detail">You guide. Your partner answers.</div><button class="button secondary full" data-route="onboarding" data-mode="interviewer">Practise as an interviewer <span aria-hidden="true">↗</span></button></article>
          <article class="landing-mode-card featured"><div class="landing-mode-top"><span class="landing-mode-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 8h15l-4-4M20 16H5l4 4"/><circle cx="4" cy="8" r="1"/><circle cx="20" cy="16" r="1"/></svg></span><span class="duration-pill">45 minutes</span></div><span class="mode-kicker">BETTER, TOGETHER</span><h3>Peer practice</h3><p>Learn from both sides of the interview. Take turns asking and answering, then exchange feedback to help each other improve.</p><div class="mode-detail">Switch halfway. Two perspectives.</div><button class="button button-light full" data-route="onboarding" data-mode="peer">Find a practice peer <span aria-hidden="true">↗</span></button></article>
        </div>
      </section>
      <section class="how-section" id="how" aria-labelledby="how-title"><div class="shell"><div class="section-heading"><div><div class="eyebrow">LESS PLANNING. MORE PRACTISING.</div><h2 id="how-title">From “what if”<br>to “I’ve got this.”</h2></div><p>A simple routine you can return to, whenever you want to build a little more confidence.</p></div><div class="process-grid"><article><span class="process-number">01</span><h3>Make it yours</h3><p>Choose your mode, technologies, and a few times today or tomorrow.</p></article><article><span class="process-number">02</span><h3>Meet your match</h3><p>We look for a partner with a compatible role, experience, and availability.</p></article><article><span class="process-number">03</span><h3>Think out loud</h3><p>Join your room, explore a question, and work through your ideas together.</p></article><article><span class="process-number">04</span><h3>Keep getting better</h3><p>Exchange thoughtful feedback and take your next step with a clearer focus.</p></article></div></div></section>
      <section class="practice-space shell"><div class="practice-space-copy"><div class="eyebrow">ONE ROOM. ROOM TO GROW.</div><h2>Everything for a<br>focused conversation.</h2><p>No complicated setup. Your practice room brings the tools and the structure, so you can focus on the person across from you.</p><button class="text-button" data-route="onboarding">Step into your next session <span aria-hidden="true">↗</span></button></div><div class="space-features"><article><span class="feature-index">01 /</span><div><h3>Work on it together</h3><p>A shared coding workspace, live chat, and questions to get the conversation going.</p></div></article><article><span class="feature-index">02 /</span><div><h3>A clear role, a shared rhythm</h3><p>Know when to ask, when to answer, and when it is time to switch.</p></div></article><article><span class="feature-index">03 /</span><div><h3>Take your progress with you</h3><p>Private notes during your session. Feedback and history you can return to afterward.</p></div></article></div></section>
      <section class="landing-cta shell"><div><div class="eyebrow">YOU DO NOT HAVE TO PREPARE ALONE</div><h2>A real conversation.<br><em>A more confident you.</em></h2><p>Pick a seat. Meet a partner. Take the next step.</p></div><button class="button button-light" data-route="onboarding">Let’s get practising <span aria-hidden="true">↗</span></button><span class="cta-orbit" aria-hidden="true"></span></section>
    </main>
