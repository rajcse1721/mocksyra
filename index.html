<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Book a focused 45-minute mock interview as a candidate or interviewer.">
  <meta name="theme-color" content="#193e35">
  <title>Mocksyra — Simple mock interviews with real people</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="call.css">
  <link rel="stylesheet" href="features.css">
  <link rel="stylesheet" href="design.css">
</head>
<body>
<div id="app"></div>
<template id="landing-template">
  <div class="landing simple-landing">
    <header class="nav shell simple-landing-nav">
      <a class="brand" href="#home" aria-label="Mocksyra home"><i aria-hidden="true">M</i>Mocksyra</a>
      <button class="button button-small" data-route="marketplace">Sign in</button>
    </header>
    <main>
      <section class="simple-hero shell" aria-labelledby="hero-title">
        <p class="hero-kicker">Live mock interviews</p>
        <h1 id="hero-title">Practise interviews with real people.</h1>
        <p>Browse an available time, choose a session, and meet privately for 45 minutes. You can join as a Candidate or an Interviewer.</p>
        <div class="hero-actions"><button class="button" data-route="marketplace">Browse sessions</button><button class="text-button" data-scroll="how">How it works</button></div>
        <small>No payment required · Private two-person rooms</small>
      </section>

      <section class="simple-roles shell" id="how" aria-labelledby="roles-title">
        <header><h2 id="roles-title">One session, two roles</h2><p>Pick your role when you book or publish a time.</p></header>
        <div class="simple-role-grid">
          <article><span class="landing-mode-icon" aria-hidden="true">C</span><div><h3>Candidate</h3><p>Answer questions, use the shared workspace, and receive feedback.</p></div></article>
          <article><span class="landing-mode-icon" aria-hidden="true">I</span><div><h3>Interviewer</h3><p>Lead the conversation, guide the candidate, and give feedback.</p></div></article>
        </div>
        <ol class="simple-flow" aria-label="How it works"><li><b>1. Browse</b><span>See all open interview times.</span></li><li><b>2. Book</b><span>Your role is selected automatically.</span></li><li><b>3. Join</b><span>Enter your private video room.</span></li></ol>
      </section>
    </main>
    <footer class="shell landing-footer"><span>© 2026 Mocksyra</span><span>Candidate meets interviewer.</span></footer>
  </div>
</template>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="supabase.js"></script>
<script src="runtime-config.js"></script>
<script src="site-config.js"></script>
<script src="auth.js"></script>
<script crossorigin src="https://unpkg.com/@daily-co/daily-js@0.92.2"></script>
<script src="app.js"></script>
</body>
</html>
